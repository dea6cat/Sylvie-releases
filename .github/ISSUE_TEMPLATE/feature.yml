name: Feature request
description: A workflow you could not complete, or behavior sylvie should have.
labels: []
body:
  - type: markdown
    attributes:
      value: |
        See [FILING_ISSUES.md](https://github.com/dea6cat/Sylvie-releases/blob/main/FILING_ISSUES.md) for what a good request contains.
  - type: textarea
    id: workflow
    attributes:
      label: The workflow
      description: What were you trying to do, step by step, and where did sylvie stop you or make it awkward?
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What happens today
      description: Current behavior, with output or screenshots if it helps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you would expect
      description: The behavior you want. If you have a concrete UI or CLI shape in mind, describe it; a prototype link is even better.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context and alternatives
      description: Workarounds you use now, related issues, how many people this affects, anything you ruled out.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched open and closed issues for the same request.
          required: true
        - label: If an agent wrote this, the body ends with `> AGENT GENERATED`.
